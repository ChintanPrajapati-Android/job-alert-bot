name: Hourly Native Android Job Alert Cron

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-job-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Job Alert Automation Cron
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: |
          node scripts/cronTrigger.js

      - name: Save History State
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff-index --quiet HEAD || git commit -m "Auto-update sent job history [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true
