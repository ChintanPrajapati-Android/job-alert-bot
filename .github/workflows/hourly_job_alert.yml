name: Hourly Native Android Job Alert Cron

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-job-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Job Alert Automation Cron
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: |
          node scripts/cronTrigger.js

      - name: Auto Commit Sent History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update sent job history [skip ci]"
          file_pattern: "data/history.json"
